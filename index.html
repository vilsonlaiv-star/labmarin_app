<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>FaceHarmony</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #000000;
            min-height: 100vh;
            padding: 16px;
            touch-action: pan-x pan-y pinch-zoom;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px 0;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 16px;
        }
        .header h1 { font-size: 20px; font-weight: 700; color: #000; }

        /* ===== БОЛЬШИЕ КНОПКИ ===== */
        .big-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #000000;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.15s;
            text-align: center;
        }
        .big-btn:active { transform: scale(0.97); background: #333; }
        .big-btn.outline {
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
        }
        .big-btn.outline:active { background: #f0f0f0; }
        .big-btn .icon { font-size: 22px; display: block; margin-bottom: 2px; }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 20px 0 10px 0;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
        }

        /* ===== КАРТОЧКА АНАЛИЗА ===== */
        .last-analysis {
            background: #f5f5f5;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 6px;
        }
        .last-analysis .date { font-size: 11px; color: #999; }
        .last-analysis .score { font-size: 26px; font-weight: 700; }
        .last-analysis .score span { font-size: 14px; font-weight: 400; color: #999; }
        .last-analysis .types { font-size: 13px; color: #555; margin-top: 2px; }
        .last-analysis .types .ok { color: #22c55e; }

        /* ===== ИСТОРИЯ ===== */
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item .left { display: flex; align-items: center; gap: 10px; }
        .history-item .left .emoji { font-size: 18px; }
        .history-item .left .info .name { font-size: 14px; font-weight: 500; }
        .history-item .left .info .date { font-size: 11px; color: #999; }
        .history-item .right .score { font-size: 16px; font-weight: 700; }
        .history-item .right .score span { font-size: 12px; font-weight: 400; color: #999; }

        /* ===== НИЖНЕЕ МЕНЮ ===== */
        .bottom-menu {
            display: flex;
            justify-content: space-around;
            margin-top: 24px;
            padding-top: 12px;
            border-top: 1px solid #e0e0e0;
            gap: 4px;
            flex-wrap: wrap;
        }
        .bottom-menu button {
            background: none;
            border: none;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            padding: 6px 10px;
            flex: 1;
            min-width: 50px;
            text-align: center;
        }
        .bottom-menu button:active { color: #000; background: #f0f0f0; border-radius: 6px; }

        /* ===== РЕЖИМ РАЗМЕТКИ ===== */
        .hidden { display: none !important; }

        .step-info {
            background: #f5f5f5;
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .step-info .title { font-size: 16px; font-weight: 600; }
        .step-info .subtitle { font-size: 13px; color: #999; margin-top: 2px; }

        /* ===== КОНТЕЙНЕР С ФОТО (ZOOM) ===== */
        .photo-wrapper {
            position: relative;
            background: #f5f5f5;
            border-radius: 14px;
            overflow: hidden;
            touch-action: pan-x pan-y pinch-zoom;
            margin-bottom: 12px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-wrapper .zoom-container {
            width: 100%;
            height: 100%;
            touch-action: pan-x pan-y pinch-zoom;
            overflow: hidden;
            position: relative;
        }
        .photo-wrapper .zoom-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            touch-action: none;
        }
        .photo-wrapper .zoom-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            pointer-events: none;
        }

        .upload-area {
            text-align: center;
            padding: 32px 16px;
            color: #999;
            cursor: pointer;
            width: 100%;
        }
        .upload-area .icon { font-size: 40px; margin-bottom: 8px; }
        .upload-area p { font-size: 15px; color: #555; }
        .upload-area .sub { font-size: 12px; color: #bbb; margin-top: 2px; }

        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .controls button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: all 0.15s;
        }
        .controls .btn-tip { background: #f0f0f0; color: #000; }
        .controls .btn-tip:active { background: #e0e0e0; }
        .controls .btn-confirm { background: #000; color: #fff; }
        .controls .btn-confirm:active { background: #333; }

        .nav {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }
        .nav button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #f0f0f0;
            color: #000;
            flex: 1;
        }
        .nav button:active { background: #e0e0e0; }
        .nav button:disabled { opacity: 0.3; pointer-events: none; }
        .nav .btn-next { background: #000; color: #fff; }
        .nav .btn-next:active { background: #333; }

        .send-btn {
            padding: 14px;
            background: #000;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .send-btn:active { background: #333; }
        .send-btn:disabled { opacity: 0.4; pointer-events: none; }

        .back-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
        }
        .back-btn:active { background: #e0e0e0; }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            max-width: 380px;
            width: 100%;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 { font-size: 17px; margin-bottom: 10px; }
        .modal-content p { font-size: 14px; color: #555; line-height: 1.5; }
        .modal-content .tip-photo { width: 100%; border-radius: 10px; margin: 10px 0; }
        .modal-content .close-btn {
            padding: 12px;
            background: #000;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .modal-content .close-btn:active { background: #333; }
    </style>
</head>
<body>
    <div class="container">

        <!-- ===== ШАПКА ===== -->
        <div class="header">
            <h1>📸 FaceHarmony</h1>
            <span>⚡</span>
        </div>

        <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->
        <div id="mainMenu">
            <button class="big-btn" id="newAnalysisBtn">
                <span class="icon">📸</span> НОВЫЙ АНАЛИЗ
            </button>
            <button class="big-btn outline" id="historyBtn">
                <span class="icon">📊</span> ИСТОРИЯ
            </button>

            <div class="section-title">📌 ПОСЛЕДНИЙ АНАЛИЗ</div>
            <div class="last-analysis" id="lastAnalysis">
                <div class="date" id="lastDate">Нет данных</div>
                <div class="score" id="lastScore">— <span>/ 10</span></div>
                <div class="types" id="lastTypes">Анфас <span class="ok">⬜</span> Профиль <span class="ok">⬜</span></div>
            </div>

            <div class="section-title">📜 ИСТОРИЯ</div>
            <div id="historyList">
                <div class="history-item">
                    <div class="left">
                        <span class="emoji">📊</span>
                        <div class="info">
                            <div class="name">Нет сохранённых анализов</div>
                            <div class="date">Пройди анализ, чтобы увидеть историю</div>
                        </div>
                    </div>
                    <div class="right"><div class="score">—</div></div>
                </div>
            </div>

            <div class="bottom-menu">
                <button id="supportBtn">🆘 Поддержка</button>
                <button id="termsBtn">📋 Условия</button>
                <button id="privacyBtn">🔒 Конфиденциальность</button>
                <button id="discordBtn">💬 Discord</button>
            </div>
        </div>

        <!-- ===== РЕЖИМ РАЗМЕТКИ ===== -->
        <div id="analysisMode" class="hidden">
            <div class="step-info">
                <div class="title" id="pointName">Линия роста волос</div>
                <div class="subtitle" id="stepDesc">Шаг 1 из 50</div>
            </div>

            <div class="photo-wrapper" id="photoWrapper">
                <div class="zoom-container" id="zoomContainer">
                    <img id="mainImage" src="" alt="Загрузите фото" style="display:none;">
                    <canvas id="canvas" style="display:none;"></canvas>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="icon">📸</div>
                    <p>Нажми, чтобы загрузить фото</p>
                    <div class="sub">Отправь фото лица анфас</div>
                </div>
            </div>

            <div class="controls" id="controls" style="display:none;">
                <button class="btn-tip" id="tipBtn">📖 Как найти</button>
                <button class="btn-confirm" id="confirmBtn">✅ Точка верна</button>
            </div>

            <div class="nav" id="nav" style="display:none;">
                <button id="backBtn">◀️ Назад</button>
                <button class="btn-next" id="nextBtn">Далее ▶️</button>
            </div>

            <button class="send-btn" id="sendBtn" disabled style="display:none;">📊 Получить результат</button>
            <button class="back-btn" id="backToMenuBtn">⬅️ Назад в меню</button>
        </div>

        <!-- ===== МОДАЛКА ===== -->
        <div class="modal" id="tipModal">
            <div class="modal-content">
                <h2 id="tipTitle">📖 Как найти</h2>
                <p id="tipText">Текст подсказки</p>
                <img class="tip-photo" id="tipPhoto" src="" alt="Подсказка">
                <button class="close-btn" id="closeTip">Понял ✅</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
                </html>
